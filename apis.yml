name: Edukita
description: >-
  Edukita (PT Edukita Budaya Cinta Belajar) is an Indonesian education company founded during the
  COVID-19 pandemic by Peter Gumulia and Sean Widjaja on the belief that high-quality education
  should be accessible to all. It teaches skills that matter through playful but powerful learning,
  delivering programs online, through six physical learning centers across Greater Jakarta (Bintaro,
  Bogor, BSD, Depok, Gading Serpong), and blended (Rumah Belajar Edukita). Programs span English with
  native speakers, early childhood development, Japanese mathematics, and professional upskilling for
  young students, families, adult learners, and corporate training. Edukita is a portfolio company of
  500 Global. It exposes no public developer API surface at this time; this profile captures its
  identity and domain-security posture.
